<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RCN — Painel do Clube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0c0f14; --ink-2:#11151c; --panel:#141922;
    --pitch-bright:#2f8c5e; --gold:#c9a04a; --red:#b7503b;
    --line:rgba(255,255,255,.09); --text:#eceae2; --muted:#888e98;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{ font-family:'Inter',system-ui,sans-serif; background:var(--ink); color:var(--text); min-height:100vh; }
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--gold);color:#0c0f14;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:0 32px; height:64px; border-bottom:1px solid var(--line);
    background:var(--ink-2); position:sticky; top:0; z-index:20;
  }
  .topbar .brand{ display:flex; align-items:center; gap:12px; }
  .topbar .brand img{ width:30px; height:30px; object-fit:contain; }
  .topbar .brand span{ font-family:'Oswald',sans-serif; font-size:16px; letter-spacing:2.5px; font-weight:600; }
  .topbar nav{ display:flex; gap:4px; }
  .topbar nav a{
    font-family:'Oswald',sans-serif; font-size:12.5px; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--muted); padding:10px 14px; border-bottom:2px solid transparent; transition:.15s; cursor:pointer;
  }
  .topbar nav a:hover{ color:var(--text); }
  .topbar nav a.active{ color:var(--text); border-color:var(--gold); }
  .notif{ position:relative; display:inline-block; }
  .notif-badge{
    position:absolute; top:-4px; right:-8px; background:var(--red); color:#fff;
    border-radius:50%; width:16px; height:16px; font-size:10px; font-weight:700;
    display:flex; align-items:center; justify-content:center; display:none;
  }
  .user-chip{ display:flex; align-items:center; gap:10px; }
  .user-chip img{ width:30px; height:30px; border-radius:50%; object-fit:cover; border:1px solid var(--line); }
  .user-chip .name{ font-size:12.5px; font-weight:600; }
  .logout-link{ font-size:10.5px; color:var(--muted); border-bottom:1px solid var(--line); margin-left:14px; cursor:pointer; }
  .logout-link:hover{ color:var(--red); }

  .hero{
    padding:36px 32px 24px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(29,92,65,.10), transparent 70%);
    display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:16px;
  }
  .hero .kicker{ font-family:'Oswald',sans-serif; font-size:11.5px; letter-spacing:3px; text-transform:uppercase; color:var(--gold); display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .hero .kicker::before{ content:''; width:22px; height:1px; background:var(--gold); }
  .hero h1{ font-family:'Oswald',sans-serif; font-size:28px; font-weight:600; }
  .hero p{ color:var(--muted); font-size:13px; margin-top:6px; }
  .budget-box{ text-align:right; }
  .budget-box .label{ font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); }
  .budget-box .amount{ font-family:'Oswald',sans-serif; font-size:28px; font-weight:700; color:var(--gold); margin-top:4px; }

  main{ max-width:1100px; margin:0 auto; padding:36px 28px 90px; }

  /* tabs */
  .tab-btns{ display:flex; gap:4px; margin-bottom:26px; border-bottom:1px solid var(--line); }
  .tab-btn{
    font-family:'Oswald',sans-serif; font-size:12.5px; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--muted); padding:12px 18px; border:none; border-bottom:2px solid transparent;
    cursor:pointer; background:none; transition:.15s;
  }
  .tab-btn.active{ color:var(--text); border-color:var(--gold); }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  /* secção head */
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px; border-bottom:1px solid var(--line); padding-bottom:12px; }
  .section-head h2{ font-family:'Oswald',sans-serif; font-size:18px; font-weight:600; }
  .section-head .note{ font-size:11.5px; color:var(--muted); }

  /* tabela de jogadores */
  table{ width:100%; border-collapse:collapse; font-size:13px; background:var(--panel); border:1px solid var(--line); }
  th{ text-align:left; font-family:'Oswald',sans-serif; font-weight:500; font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); padding:10px 12px; border-bottom:1px solid var(--line); }
  td{ padding:10px 12px; border-bottom:1px solid var(--line); }
  tr:hover td{ background:rgba(255,255,255,.02); }
  td.num{ text-align:center; }
  .stat-val{ font-family:'Oswald',sans-serif; font-weight:600; }
  .card-y{ display:inline-block; width:10px; height:14px; background:#e8c42a; border-radius:1px; margin-right:3px; }
  .card-r{ display:inline-block; width:10px; height:14px; background:var(--red); border-radius:1px; }

  /* propostas */
  .proposals-list{ display:flex; flex-direction:column; gap:12px; }
  .proposal-card{
    background:var(--panel); border:1px solid var(--line); padding:16px 18px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
  }
  .proposal-card .info .player{ font-size:14px; font-weight:600; }
  .proposal-card .info .from{ font-size:12px; color:var(--muted); margin-top:3px; }
  .proposal-card .info .msg{ font-size:12px; color:var(--muted); margin-top:4px; font-style:italic; }
  .proposal-card .valor{ font-family:'Oswald',sans-serif; font-size:20px; font-weight:700; color:var(--gold); }
  .proposal-card .actions{ display:flex; gap:8px; }
  .btn-accept{ background:var(--pitch-bright); border:none; color:#0c0f14; font-weight:700; padding:9px 16px; font-size:12px; cursor:pointer; font-family:'Oswald',sans-serif; letter-spacing:1px; text-transform:uppercase; }
  .btn-reject{ background:transparent; border:1px solid var(--red); color:var(--red); font-weight:700; padding:9px 16px; font-size:12px; cursor:pointer; font-family:'Inter',sans-serif; }
  .btn-reject:hover{ background:var(--red); color:#fff; }

  /* mercado / contratar */
  .market-closed{ text-align:center; padding:50px; color:var(--muted); font-size:14px; border:1px solid var(--line); }
  .player-row{ display:flex; align-items:center; gap:14px; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  .player-row .avatar{ width:36px; height:36px; border-radius:50%; background:#1c222c; display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-size:12px; font-weight:600; border:1px solid var(--line); flex-shrink:0; }
  .player-row .pinfo{ flex:1; }
  .player-row .pname{ font-size:13.5px; font-weight:600; }
  .player-row .pclub{ font-size:11px; color:var(--gold); }
  .player-row .pstats{ font-size:11.5px; color:var(--muted); }
  .player-row .pactions{ display:flex; gap:8px; }
  .btn-propose{ background:var(--pitch-bright); border:none; color:#0c0f14; font-weight:700; padding:8px 14px; font-size:11.5px; cursor:pointer; font-family:'Oswald',sans-serif; letter-spacing:1px; text-transform:uppercase; }
  .btn-propose:hover{ background:#3da06b; }
  .btn-propose:disabled{ opacity:.4; cursor:default; }

  /* modal proposta */
  .modal-bg{
    position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .modal{
    background:var(--ink-2); border:1px solid var(--line); padding:28px 28px 24px;
    width:100%; max-width:380px;
  }
  .modal h3{ font-family:'Oswald',sans-serif; font-size:18px; font-weight:600; margin-bottom:6px; }
  .modal .sub{ font-size:12.5px; color:var(--muted); margin-bottom:18px; }
  .modal input, .modal textarea{
    width:100%; background:var(--ink); border:1px solid var(--line); color:var(--text);
    padding:10px 12px; font-size:13px; font-family:'Inter',sans-serif; margin-bottom:10px;
  }
  .modal textarea{ resize:vertical; min-height:60px; }
  .modal .hint{ font-size:11px; color:var(--muted); margin-bottom:16px; }
  .modal .footer{ display:flex; gap:10px; }
  .modal .footer .btn-accept{ flex:1; }
  .modal .footer .btn-cancel{ flex:1; background:transparent; border:1px solid var(--line); color:var(--muted); font-size:12px; cursor:pointer; padding:9px; }
  .modal .footer .btn-cancel:hover{ color:#fff; }

  .empty{ text-align:center; color:var(--muted); font-size:13px; padding:40px; }
  .status-msg{ font-size:12px; color:var(--muted); margin-top:12px; }
</style>
</head>

      <div class="name" id="userName">—</div>
      <img id="userAvatar" src="" alt="">
    </div>
    <span class="logout-link" id="logoutLink">Sair</span>
  </div>
</div>

<div class="hero">
  <div>
    <div class="kicker">Painel do Clube</div>
    <h1 id="clubName">A carregar…</h1>
    <p id="clubMeta"></p>
  </div>
  <div class="budget-box">
    <div class="label">Orçamento</div>
    <div class="amount" id="clubBudget">—</div>
  </div>
</div>

<main>
  <div class="tab-btns">
    <button class="tab-btn active" data-tab="team">
      <span class="notif">Clube<span class="notif-badge" id="proposalsBadge">0</span></span>
    </button>
    <button class="tab-btn" data-tab="market">Contratar</button>
  </div>

  <!-- CLUBE: jogadores + propostas recebidas -->
  <div class="tab-panel active" id="tab-team">
    <div class="section-head">
      <h2>Plantel</h2>
      <span class="note" id="playerCount">—</span>
    </div>
    <table id="rosterTable">
      <thead>
        <tr>
          <th>Jogador</th>
          <th class="num">⚽</th>
          <th class="num">🅰️</th>
          <th class="num">🟨</th>
          <th class="num">🟥</th>
        </tr>
      </thead>
      <tbody id="rosterBody"></tbody>
    </table>

    <div class="section-head" style="margin-top:36px;">
      <h2>Propostas recebidas</h2>
      <span class="note" id="proposalsCount">—</span>
    </div>
    <div class="proposals-list" id="proposalsList"></div>
    <div class="status-msg" id="teamStatus"></div>
  </div>

  <!-- CONTRATAR: jogadores de outros clubes -->
  <div class="tab-panel" id="tab-market">
    <div id="marketClosedMsg" class="market-closed" style="display:none;">
      🔒 O mercado de transferências está fechado. Aguarda que a staff o abra.
    </div>
    <div id="marketContent" style="display:none;">
      <div class="section-head">
        <h2>Jogadores disponíveis</h2>
        <span class="note" id="otherCount">—</span>
      </div>
      <div id="otherPlayers"></div>
    </div>
  </div>
</main>

<!-- Modal de proposta -->
<div class="modal-bg" id="modalBg" style="display:none;">
  <div class="modal">
    <h3 id="modalTitle">Enviar proposta</h3>
    <div class="sub" id="modalSub"></div>
    <input type="number" id="modalAmount" placeholder="Valor da oferta (€)" min="0">
    <div class="hint" id="modalBudgetHint"></div>
    <textarea id="modalMsg" placeholder="Mensagem (opcional)"></textarea>
    <div class="footer">
      <button class="btn-accept" id="modalSendBtn">Enviar proposta</button>
      <button class="btn-cancel" id="modalCancelBtn">Cancelar</button>
    </div>
    <div class="status-msg" id="modalStatus"></div>
  </div>
</div>

<script>
  const savedUser = localStorage.getItem('rcn_user');
  if(!savedUser){ window.location.href = 'login.html'; }
  const user = JSON.parse(savedUser || '{}');
  if(user){
    document.getElementById('userAvatar').src = user.avatarUrl || '';
    document.getElementById('userName').textContent = user.username || '';
  }
  document.getElementById('logoutLink').addEventListener('click', () => {
    localStorage.removeItem('rcn_user');
    window.location.href = 'login.html';
  });

  // verificação de dono de clube
  if(!user.isOwner){
    document.querySelector('main').innerHTML = `<div class="empty" style="padding:80px;">Precisas de ter o cargo de Dono de Clube no servidor de Discord da RCN para aceder a esta página.</div>`;
  }

  function initials(name){ return (name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

  /* ---------- TABS ---------- */
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      if(btn.dataset.tab === 'market') loadMarket();
    });
  });

  /* ---------- carregar dados do clube ---------- */
  let myClub = null;
  let myBudget = 0;

  async function loadClub(){
    try{
      const res = await fetch(`/api/club/mine?user_id=${user.id}`);
      if(!res.ok){
        const err = await res.json();
        document.querySelector('main').innerHTML = `<div class="empty" style="padding:80px;">${err.error || 'Erro ao carregar o clube.'}</div>`;
        return;
      }
      const data = await res.json();
      myClub = data.club;
      myBudget = data.club.budget ?? 30000;

      document.getElementById('clubName').textContent = myClub.name;
      document.getElementById('clubMeta').textContent = [myClub.city, myClub.manager ? 'Treinador: ' + myClub.manager : null].filter(Boolean).join(' · ');
      document.getElementById('clubBudget').textContent = myBudget.toLocaleString('pt') + ' €';

      // plantel
      const tbody = document.getElementById('rosterBody');
      tbody.innerHTML = '';
      document.getElementById('playerCount').textContent = data.players.length + ' jogadores';
      data.players.forEach(p => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${p.name}</td>
          <td class="num"><span class="stat-val">${p.goals ?? 0}</span></td>
          <td class="num"><span class="stat-val">${p.assists ?? 0}</span></td>
          <td class="num">${'<span class="card-y"></span>'.repeat(Math.min(p.yellow_cards ?? 0, 5))} ${p.yellow_cards ?? 0}</td>
          <td class="num">${p.red_cards ? '<span class="card-r"></span> ' + p.red_cards : '0'}</td>
        `;
        tbody.appendChild(tr);
      });
      if(data.players.length === 0) tbody.innerHTML = `<tr><td colspan="5" class="empty">Sem jogadores no plantel.</td></tr>`;

      // propostas recebidas
      const propList = document.getElementById('proposalsList');
      propList.innerHTML = '';
      const badge = document.getElementById('proposalsBadge');
      document.getElementById('proposalsCount').textContent = data.proposals.length + ' pendentes';
      if(data.proposals.length > 0){
        badge.textContent = data.proposals.length;
        badge.style.display = 'flex';
      } else {
        badge.style.display = 'none';
      }

      if(data.proposals.length === 0){
        propList.innerHTML = `<div class="empty">Sem propostas pendentes.</div>`;
      } else {
        data.proposals.forEach(p => {
          const card = document.createElement('div');
          card.className = 'proposal-card';
          card.innerHTML = `
            <div class="info">
              <div class="player">${p.players?.name || '—'}</div>
              <div class="from">Proposta de: <b>${p.from_club?.name || '—'}</b></div>
              ${p.message ? `<div class="msg">"${p.message}"</div>` : ''}
            </div>
            <div class="valor">${Number(p.amount).toLocaleString('pt')} €</div>
            <div class="actions">
              <button class="btn-accept" data-id="${p.id}" data-action="accept">Aceitar</button>
              <button class="btn-reject" data-id="${p.id}" data-action="reject">Rejeitar</button>
            </div>
          `;
          card.querySelectorAll('[data-action]').forEach(btn => {
            btn.addEventListener('click', async () => {
              const action = btn.dataset.action;
              if(action === 'accept' && !confirm(`Aceitar a proposta de ${Number(p.amount).toLocaleString('pt')} € por ${p.players?.name}?`)) return;
              btn.disabled = true;
              try{
                const res = await fetch(`/api/proposals/${p.id}`, {
                  method: 'PATCH',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ user_id: user.id, action })
                });
                const result = await res.json();
                if(!res.ok) throw new Error(result.error);
                document.getElementById('teamStatus').textContent = action === 'accept' ? '✅ Transferência concluída!' : '❌ Proposta rejeitada.';
                loadClub();
              }catch(err){
                document.getElementById('teamStatus').textContent = err.message;
                btn.disabled = false;
              }
            });
          });
          propList.appendChild(card);
        });
      }
    }catch(err){
      document.getElementById('teamStatus').textContent = 'Erro: ' + err.message;
    }
  }

  /* ---------- MERCADO (contratar) ---------- */
  async function loadMarket(){
    const closedMsg = document.getElementById('marketClosedMsg');
    const content = document.getElementById('marketContent');
    try{
      const statusRes = await fetch('/api/market/status');
      const status = await statusRes.json();
      if(!status.is_open){
        closedMsg.style.display = 'block';
        content.style.display = 'none';
        return;
      }
      closedMsg.style.display = 'none';
      content.style.display = 'block';

      const res = await fetch(`/api/club/others?user_id=${user.id}`);
      const players = await res.json();
      document.getElementById('otherCount').textContent = Array.isArray(players) ? players.length + ' jogadores' : '';
      const container = document.getElementById('otherPlayers');
      container.innerHTML = '';
      if(!Array.isArray(players) || players.length === 0){
        container.innerHTML = `<div class="empty">Sem jogadores de outros clubes disponíveis.</div>`;
        return;
      }
      players.forEach(p => {
        const row = document.createElement('div');
        row.className = 'player-row';
        row.innerHTML = `
          <div class="avatar">${initials(p.name)}</div>
          <div class="pinfo">
            <div class="pname">${p.name}</div>
            <div class="pclub">${p.clubs?.name || 'Sem clube'}</div>
            <div class="pstats">⚽ ${p.goals ?? 0} &nbsp;🅰️ ${p.assists ?? 0} &nbsp;🟨 ${p.yellow_cards ?? 0} &nbsp;🟥 ${p.red_cards ?? 0}</div>
          </div>
          <div class="pactions">
            <button class="btn-propose" data-player-id="${p.id}" data-player-name="${p.name}" data-club-name="${p.clubs?.name || ''}">Enviar proposta</button>
          </div>
        `;
        row.querySelector('.btn-propose').addEventListener('click', (e) => {
          openModal(e.currentTarget.dataset.playerId, e.currentTarget.dataset.playerName, e.currentTarget.dataset.clubName);
        });
        container.appendChild(row);
      });
    }catch(err){
      document.getElementById('marketClosedMsg').style.display = 'block';
      document.getElementById('marketClosedMsg').textContent = 'Erro ao carregar o mercado.';
    }
  }

  /* ---------- MODAL de proposta ---------- */
  let modalPlayerId = null;
  function openModal(playerId, playerName, clubName){
    modalPlayerId = playerId;
    document.getElementById('modalTitle').textContent = 'Proposta para ' + playerName;
    document.getElementById('modalSub').textContent = 'Clube atual: ' + clubName;
    document.getElementById('modalBudgetHint').textContent = 'Orçamento disponível: ' + myBudget.toLocaleString('pt') + ' €';
    document.getElementById('modalAmount').value = '';
    document.getElementById('modalMsg').value = '';
    document.getElementById('modalStatus').textContent = '';
    document.getElementById('modalBg').style.display = 'flex';
  }
  document.getElementById('modalCancelBtn').addEventListener('click', () => {
    document.getElementById('modalBg').style.display = 'none';
  });
  document.getElementById('modalSendBtn').addEventListener('click', async () => {
    const amount = Number(document.getElementById('modalAmount').value);
    const message = document.getElementById('modalMsg').value.trim();
    if(!amount || amount <= 0){ document.getElementById('modalStatus').textContent = 'Indica um valor válido.'; return; }
    if(amount > myBudget){ document.getElementById('modalStatus').textContent = 'Orçamento insuficiente.'; return; }
    const btn = document.getElementById('modalSendBtn');
    btn.disabled = true;
    try{
      const res = await fetch('/api/proposals', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: user.id, player_id: modalPlayerId, amount, message })
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error);
      document.getElementById('modalBg').style.display = 'none';
      alert('✅ Proposta enviada com sucesso!');
    }catch(err){
      document.getElementById('modalStatus').textContent = err.message;
    }finally{
      btn.disabled = false;
    }
  });

  if(user.isOwner) loadClub();
</script>

</body>
</html>
