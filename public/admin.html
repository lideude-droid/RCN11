<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RCN — Administração</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0c0f14; --ink-2:#11151c; --panel:#141922;
    --pitch-bright:#2f8c5e; --gold:#c9a04a; --red:#b7503b;
    --line:rgba(255,255,255,.09); --text:#eceae2; --muted:#888e98;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{ font-family:'Inter',system-ui,sans-serif; background:var(--ink); color:var(--text); min-height:100vh; }
  a{color:inherit;text-decoration:none;}

  /* ---------- ecrã de login ---------- */
  .gate{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .gate-box{
    width:100%; max-width:340px; background:var(--panel); border:1px solid var(--line); padding:32px;
  }
  .gate-box .eyebrow{ font-family:'Oswald',sans-serif; font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--gold); margin-bottom:8px; }
  .gate-box h1{ font-family:'Oswald',sans-serif; font-size:22px; font-weight:600; margin-bottom:22px; }
  .gate-box input{
    width:100%; background:var(--ink); border:1px solid var(--line); color:var(--text);
    padding:11px 12px; font-size:13.5px; margin-bottom:12px; font-family:'Inter',sans-serif;
  }
  .gate-box button{
    width:100%; background:var(--gold); border:none; color:#0c0f14; font-weight:700;
    padding:12px; font-family:'Oswald',sans-serif; letter-spacing:1px; text-transform:uppercase;
    font-size:12.5px; cursor:pointer; margin-top:6px;
  }
  .gate-box button:hover{ background:#dbb663; }
  .gate-error{ color:var(--red); font-size:12.5px; margin-top:10px; min-height:16px; }

  /* ---------- painel ---------- */
  #panel{ display:none; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:0 32px; height:64px; border-bottom:1px solid var(--line); background:var(--ink-2);
    position:sticky; top:0; z-index:20;
  }
  .topbar .brand{ font-family:'Oswald',sans-serif; font-size:16px; letter-spacing:2.5px; font-weight:600; display:flex; align-items:center; gap:10px; }
  .topbar .brand .tag{ font-size:10px; background:var(--gold); color:#0c0f14; padding:2px 8px; letter-spacing:1px; }
  .topbar .out{ font-size:11.5px; color:var(--muted); border-bottom:1px solid var(--line); cursor:pointer; }
  .topbar .out:hover{ color:var(--red); border-color:var(--red); }

  main{ max-width:1100px; margin:0 auto; padding:36px 28px 90px; }
  .tabs{ display:flex; gap:4px; margin-bottom:28px; border-bottom:1px solid var(--line); }
  .tab-btn{
    font-family:'Oswald',sans-serif; font-size:12.5px; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--muted); padding:12px 18px; border-bottom:2px solid transparent; cursor:pointer; background:none; border-top:none; border-left:none; border-right:none;
  }
  .tab-btn.active{ color:var(--text); border-color:var(--gold); }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  .toolbar{ display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; align-items:center; }
  .toolbar input, .toolbar select{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    padding:9px 11px; font-size:13px; font-family:'Inter',sans-serif;
  }
  .toolbar button{
    background:var(--pitch-bright); border:none; color:#0c0f14; font-weight:700;
    padding:9px 16px; font-family:'Oswald',sans-serif; letter-spacing:1px; text-transform:uppercase;
    font-size:11.5px; cursor:pointer;
  }
  .toolbar button:hover{ background:#3da06b; }

  table{ width:100%; border-collapse:collapse; font-size:13px; background:var(--panel); border:1px solid var(--line); }
  th{
    text-align:left; font-family:'Oswald',sans-serif; font-weight:500; font-size:10.5px;
    letter-spacing:1.5px; text-transform:uppercase; color:var(--muted);
    padding:10px 10px; border-bottom:1px solid var(--line); white-space:nowrap;
  }
  td{ padding:7px 10px; border-bottom:1px solid var(--line); }
  td input, td select{
    width:64px; background:transparent; border:1px solid transparent; color:var(--text);
    padding:5px 6px; font-size:13px; font-family:'Inter',sans-serif;
  }
  td input.name-input{ width:150px; }
  td input:focus, td select:focus{ border-color:var(--gold); outline:none; background:var(--ink); }
  td select{ width:140px; }
  .row-actions{ display:flex; gap:8px; }
  .row-actions button{
    background:none; border:1px solid var(--line); color:var(--muted); font-size:11px;
    padding:5px 10px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .row-actions .save-btn:hover{ border-color:var(--pitch-bright); color:var(--pitch-bright); }
  .row-actions .del-btn:hover{ border-color:var(--red); color:var(--red); }

  .status-msg{ font-size:12px; color:var(--muted); margin-top:14px; min-height:16px; }
</style>
</head>
<body>

  <div class="gate" id="gate">
    <div class="gate-box">
      <div class="eyebrow">Acesso restrito</div>
      <h1>Administração RCN</h1>
      <input type="text" id="adminUser" placeholder="Utilizador">
      <input type="password" id="adminPass" placeholder="Palavra-passe">
      <button id="gateBtn">Entrar</button>
      <div class="gate-error" id="gateError"></div>
    </div>
  </div>

  <div id="panel">
    <div class="topbar">
      <div class="brand">RCN <span class="tag">Admin</span></div>
      <div class="out" id="adminLogout">Sair da administração</div>
    </div>

    <main>
      <div class="tabs">
        <button class="tab-btn active" data-tab="clubs">Clubes &amp; Classificação</button>
        <button class="tab-btn" data-tab="players">Jogadores &amp; Estatísticas</button>
      </div>

      <!-- ---------------- CLUBES ---------------- -->
      <section class="tab-panel active" id="tab-clubs">
        <div class="toolbar">
          <input type="text" id="newClubName" placeholder="Nome do clube">
          <input type="text" id="newClubCity" placeholder="Cidade">
          <input type="text" id="newClubManager" placeholder="Treinador">
          <button id="addClubBtn">Adicionar clube</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>Clube</th><th>Cidade</th><th>Treinador</th>
              <th>J</th><th>V</th><th>E</th><th>D</th><th>GM</th><th>GS</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="clubsBody"></tbody>
        </table>
        <div class="status-msg" id="clubsStatus"></div>
      </section>

      <!-- ---------------- JOGADORES ---------------- -->
      <section class="tab-panel" id="tab-players">
        <div class="toolbar">
          <input type="text" id="newPlayerName" placeholder="Nome do jogador">
          <select id="newPlayerClub"><option value="">Sem clube</option></select>
          <button id="addPlayerBtn">Adicionar jogador</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>Jogador</th><th>Clube</th><th>Golos</th><th>Assist.</th><th>Amarelos</th><th>Vermelhos</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="playersBody"></tbody>
        </table>
        <div class="status-msg" id="playersStatus"></div>
      </section>
    </main>
  </div>

<script>
  const ADMIN_USER = 'RCN';
  const ADMIN_PASS = 'rcnprime123';

  const gate = document.getElementById('gate');
  const panel = document.getElementById('panel');
  let adminKey = sessionStorage.getItem('rcn_admin_key');

  function unlock(){
    gate.style.display = 'none';
    panel.style.display = 'block';
    loadClubs();
    loadPlayers();
  }

  if(adminKey === ADMIN_PASS){
    unlock();
  }

  document.getElementById('gateBtn').addEventListener('click', () => {
    const u = document.getElementById('adminUser').value.trim();
    const p = document.getElementById('adminPass').value;
    if(u === ADMIN_USER && p === ADMIN_PASS){
      adminKey = p;
      sessionStorage.setItem('rcn_admin_key', p);
      unlock();
    } else {
      document.getElementById('gateError').textContent = 'Utilizador ou palavra-passe incorretos.';
    }
  });

  document.getElementById('adminLogout').addEventListener('click', () => {
    sessionStorage.removeItem('rcn_admin_key');
    window.location.reload();
  });

  // ---------- tabs ----------
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  // ---------- helper de pedidos à API admin ----------
  async function adminFetch(url, options = {}){
    const res = await fetch(url, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        'x-admin-key': adminKey,
        ...(options.headers || {})
      }
    });
    if(!res.ok){
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error || ('Erro ' + res.status));
    }
    return res.status === 204 ? null : res.json();
  }

  /* ===================== CLUBES ===================== */
  let clubsCache = [];

  async function loadClubs(){
    const status = document.getElementById('clubsStatus');
    try{
      clubsCache = await adminFetch('/api/admin/clubs');
      renderClubs();
      fillClubSelect();
    }catch(err){ status.textContent = err.message; }
  }

  function renderClubs(){
    const body = document.getElementById('clubsBody');
    body.innerHTML = '';
    clubsCache.forEach(c => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input class="name-input" data-f="name" value="${c.name || ''}"></td>
        <td><input data-f="city" value="${c.city || ''}"></td>
        <td><input data-f="manager" value="${c.manager || ''}"></td>
        <td><input data-f="played" type="number" value="${c.played ?? 0}"></td>
        <td><input data-f="won" type="number" value="${c.won ?? 0}"></td>
        <td><input data-f="drawn" type="number" value="${c.drawn ?? 0}"></td>
        <td><input data-f="lost" type="number" value="${c.lost ?? 0}"></td>
        <td><input data-f="goals_for" type="number" value="${c.goals_for ?? 0}"></td>
        <td><input data-f="goals_against" type="number" value="${c.goals_against ?? 0}"></td>
        <td class="row-actions">
          <button class="save-btn">Guardar</button>
          <button class="del-btn">Apagar</button>
        </td>
      `;
      tr.querySelector('.save-btn').addEventListener('click', async () => {
        const updates = {};
        tr.querySelectorAll('[data-f]').forEach(inp => {
          const f = inp.dataset.f;
          updates[f] = inp.type === 'number' ? Number(inp.value) : inp.value;
        });
        const status = document.getElementById('clubsStatus');
        try{
          await adminFetch(`/api/admin/clubs/${c.id}`, { method:'PATCH', body: JSON.stringify(updates) });
          status.textContent = `"${updates.name}" atualizado.`;
          loadClubs();
        }catch(err){ status.textContent = err.message; }
      });
      tr.querySelector('.del-btn').addEventListener('click', async () => {
        if(!confirm(`Apagar o clube "${c.name}"?`)) return;
        try{
          await adminFetch(`/api/admin/clubs/${c.id}`, { method:'DELETE' });
          loadClubs();
        }catch(err){ document.getElementById('clubsStatus').textContent = err.message; }
      });
      body.appendChild(tr);
    });
  }

  document.getElementById('addClubBtn').addEventListener('click', async () => {
    const name = document.getElementById('newClubName').value.trim();
    const city = document.getElementById('newClubCity').value.trim();
    const manager = document.getElementById('newClubManager').value.trim();
    if(!name) return;
    try{
      await adminFetch('/api/admin/clubs', { method:'POST', body: JSON.stringify({ name, city, manager }) });
      document.getElementById('newClubName').value = '';
      document.getElementById('newClubCity').value = '';
      document.getElementById('newClubManager').value = '';
      loadClubs();
    }catch(err){ document.getElementById('clubsStatus').textContent = err.message; }
  });

  function fillClubSelect(){
    const sel = document.getElementById('newPlayerClub');
    sel.innerHTML = '<option value="">Sem clube</option>';
    clubsCache.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.id; opt.textContent = c.name;
      sel.appendChild(opt);
    });
  }

  /* ===================== JOGADORES ===================== */
  let playersCache = [];

  async function loadPlayers(){
    const status = document.getElementById('playersStatus');
    try{
      playersCache = await adminFetch('/api/admin/players');
      renderPlayers();
    }catch(err){ status.textContent = err.message; }
  }

  function clubOptions(selectedId){
    let html = `<option value="">Sem clube</option>`;
    clubsCache.forEach(c => {
      html += `<option value="${c.id}" ${c.id === selectedId ? 'selected' : ''}>${c.name}</option>`;
    });
    return html;
  }

  function renderPlayers(){
    const body = document.getElementById('playersBody');
    body.innerHTML = '';
    playersCache.forEach(p => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input class="name-input" data-f="name" value="${p.name || ''}"></td>
        <td><select data-f="club_id">${clubOptions(p.club_id)}</select></td>
        <td><input data-f="goals" type="number" value="${p.goals ?? 0}"></td>
        <td><input data-f="assists" type="number" value="${p.assists ?? 0}"></td>
        <td><input data-f="yellow_cards" type="number" value="${p.yellow_cards ?? 0}"></td>
        <td><input data-f="red_cards" type="number" value="${p.red_cards ?? 0}"></td>
        <td class="row-actions">
          <button class="save-btn">Guardar</button>
          <button class="del-btn">Apagar</button>
        </td>
      `;
      tr.querySelector('.save-btn').addEventListener('click', async () => {
        const updates = {};
        tr.querySelectorAll('[data-f]').forEach(inp => {
          const f = inp.dataset.f;
          if(f === 'club_id') updates[f] = inp.value || null;
          else updates[f] = inp.type === 'number' ? Number(inp.value) : inp.value;
        });
        const status = document.getElementById('playersStatus');
        try{
          await adminFetch(`/api/admin/players/${p.id}`, { method:'PATCH', body: JSON.stringify(updates) });
          status.textContent = `"${updates.name}" atualizado.`;
          loadPlayers();
        }catch(err){ status.textContent = err.message; }
      });
      tr.querySelector('.del-btn').addEventListener('click', async () => {
        if(!confirm(`Apagar o jogador "${p.name}"?`)) return;
        try{
          await adminFetch(`/api/admin/players/${p.id}`, { method:'DELETE' });
          loadPlayers();
        }catch(err){ document.getElementById('playersStatus').textContent = err.message; }
      });
      body.appendChild(tr);
    });
  }

  document.getElementById('addPlayerBtn').addEventListener('click', async () => {
    const name = document.getElementById('newPlayerName').value.trim();
    const club_id = document.getElementById('newPlayerClub').value || null;
    if(!name) return;
    try{
      await adminFetch('/api/admin/players', { method:'POST', body: JSON.stringify({ name, club_id }) });
      document.getElementById('newPlayerName').value = '';
      loadPlayers();
    }catch(err){ document.getElementById('playersStatus').textContent = err.message; }
  });
</script>

</body>
</html>
