<title>RCN — Administração</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0c0f14; --ink-2:#11151c; --panel:#141922;
    --pitch-bright:#2f8c5e; --gold:#c9a04a; --red:#b7503b;
    --line:rgba(255,255,255,.09); --text:#eceae2; --muted:#888e98;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{ font-family:'Inter',system-ui,sans-serif; background:var(--ink); color:var(--text); min-height:100vh; }
  a{color:inherit;text-decoration:none;}

  /* ---------- ecrã de login ---------- */
  .gate{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .gate-box{
    width:100%; max-width:340px; background:var(--panel); border:1px solid var(--line); padding:32px;
  }
  .gate-box .eyebrow{ font-family:'Oswald',sans-serif; font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--gold); margin-bottom:8px; }
  .gate-box h1{ font-family:'Oswald',sans-serif; font-size:22px; font-weight:600; margin-bottom:22px; }
  .gate-box input{
    width:100%; background:var(--ink); border:1px solid var(--line); color:var(--text);
    padding:11px 12px; font-size:13.5px; margin-bottom:12px; font-family:'Inter',sans-serif;
  }
  .gate-box button{
    width:100%; background:var(--gold); border:none; color:#0c0f14; font-weight:700;
    padding:12px; font-family:'Oswald',sans-serif; letter-spacing:1px; text-transform:uppercase;
    font-size:12.5px; cursor:pointer; margin-top:6px;
  }
  .gate-box button:hover{ background:#dbb663; }
  .gate-error{ color:var(--red); font-size:12.5px; margin-top:10px; min-height:16px; }

  /* ---------- painel ---------- */
  #panel{ display:none; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:0 32px; height:64px; border-bottom:1px solid var(--line); background:var(--ink-2);
    position:sticky; top:0; z-index:20;
  }
  .topbar .brand{ font-family:'Oswald',sans-serif; font-size:16px; letter-spacing:2.5px; font-weight:600; display:flex; align-items:center; gap:10px; }
  .topbar .brand .tag{ font-size:10px; background:var(--gold); color:#0c0f14; padding:2px 8px; letter-spacing:1px; }
  .topbar .out{ font-size:11.5px; color:var(--muted); border-bottom:1px solid var(--line); cursor:pointer; }
  .topbar .out:hover{ color:var(--red); border-color:var(--red); }

  main{ max-width:1100px; margin:0 auto; padding:36px 28px 90px; }
  .tabs{ display:flex; gap:4px; margin-bottom:28px; border-bottom:1px solid var(--line); }
  .tab-btn{
    font-family:'Oswald',sans-serif; font-size:12.5px; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--muted); padding:12px 18px; border-bottom:2px solid transparent; cursor:pointer; background:none; border-top:none; border-left:none; border-right:none;
  }
  .tab-btn.active{ color:var(--text); border-color:var(--gold); }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  .toolbar{ display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; align-items:center; }
  .toolbar input, .toolbar select{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    padding:9px 11px; font-size:13px; font-family:'Inter',sans-serif;
  }
  .toolbar button{
    background:var(--pitch-bright); border:none; color:#0c0f14; font-weight:700;
    padding:9px 16px; font-family:'Oswald',sans-serif; letter-spacing:1px; text-transform:uppercase;
    font-size:11.5px; cursor:pointer;
  }
  .toolbar button:hover{ background:#3da06b; }

  table{ width:100%; border-collapse:collapse; font-size:13px; background:var(--panel); border:1px solid var(--line); }
  th{
    text-align:left; font-family:'Oswald',sans-serif; font-weight:500; font-size:10.5px;
    letter-spacing:1.5px; text-transform:uppercase; color:var(--muted);
    padding:10px 10px; border-bottom:1px solid var(--line); white-space:nowrap;
  }
  td{ padding:7px 10px; border-bottom:1px solid var(--line); }
  td input, td select{
    width:64px; background:transparent; border:1px solid transparent; color:var(--text);
    padding:5px 6px; font-size:13px; font-family:'Inter',sans-serif;
  }
  td input.name-input{ width:150px; }
  td input:focus, td select:focus{ border-color:var(--gold); outline:none; background:var(--ink); }
  td select{ width:140px; }
  .row-actions{ display:flex; gap:8px; }
  .row-actions button{
    background:none; border:1px solid var(--line); color:var(--muted); font-size:11px;
    padding:5px 10px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .row-actions .save-btn:hover{ border-color:var(--pitch-bright); color:var(--pitch-bright); }
  .row-actions .del-btn:hover{ border-color:var(--red); color:var(--red); }

  .status-msg{ font-size:12px; color:var(--muted); margin-top:14px; min-height:16px; }

  /* mercado */
  .market-toggle{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--panel); border:1px solid var(--line); padding:22px 24px; max-width:480px;
  }
  .market-label{ font-family:'Oswald',sans-serif; font-size:17px; font-weight:600; }
  .market-sub{ font-size:12px; color:var(--muted); margin-top:4px; }
  .toggle-btn{
    font-family:'Oswald',sans-serif; font-size:12.5px; font-weight:700; letter-spacing:1px;
    text-transform:uppercase; padding:10px 22px; border:none; cursor:pointer; transition:.15s;
  }
  .toggle-btn.open{ background:var(--pitch-bright); color:#0c0f14; }
  .toggle-btn.close{ background:var(--red); color:#fff; }
  .toggle-btn:disabled{ opacity:.4; cursor:default; }

  /* campo discord_role_id */
  td input.role-input{ width:200px; }
</style>
</head>
<body>

  <div class="gate" id="gate">
    <div class="gate-box">
      <div class="eyebrow">Acesso restrito</div>
      <h1>Administração RCN</h1>
      <input type="text" id="adminUser" placeholder="Utilizador">
      <input type="password" id="adminPass" placeholder="Palavra-passe">
      <button id="gateBtn">Entrar</button>
      <div class="gate-error" id="gateError"></div>
    </div>
  </div>

  <div id="panel">
    <div class="topbar">
      <div class="brand">RCN <span class="tag">Admin</span></div>
      <div class="out" id="adminLogout">Sair da administração</div>
    </div>

    <main>
      <div class="tabs">
        <button class="tab-btn active" data-tab="clubs">Clubes &amp; Classificação</button>
        <button class="tab-btn" data-tab="players">Jogadores &amp; Estatísticas</button>
        <button class="tab-btn" data-tab="market">Mercado</button>
        <button class="tab-btn" data-tab="matches">Jogos</button>
      </div>

      <!-- ---------------- CLUBES ---------------- -->
      <section class="tab-panel active" id="tab-clubs">
        <div class="toolbar">
          <input type="text" id="newClubName" placeholder="Nome do clube">
          <input type="text" id="newClubCity" placeholder="Cidade">
          <input type="text" id="newClubManager" placeholder="Treinador">
          <input type="text" id="newClubAssistant" placeholder="Treinador adjunto (opcional)">
          <button id="addClubBtn">Adicionar clube</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>Clube</th><th>Cidade</th><th>Treinador</th><th>Adjunto</th><th>Cargo Discord</th><th>Orçamento</th>
              <th>J</th><th>V</th><th>E</th><th>D</th><th>GM</th><th>GS</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="clubsBody"></tbody>
        </table>
        <div class="status-msg" id="clubsStatus"></div>
      </section>

      <!-- ---------------- JOGADORES ---------------- -->
      <section class="tab-panel" id="tab-players">
        <div class="toolbar">
          <input type="text" id="newPlayerName" placeholder="Nome do jogador">
          <select id="newPlayerClub"><option value="">Sem clube</option></select>
          <button id="addPlayerBtn">Adicionar jogador</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>Jogador</th><th>Clube</th><th>Golos</th><th>Assist.</th><th>Amarelos</th><th>Vermelhos</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="playersBody"></tbody>
        </table>
        <div class="status-msg" id="playersStatus"></div>
      </section>

      <!-- ---------------- MERCADO ---------------- -->
      <section class="tab-panel" id="tab-market">
        <div class="market-toggle" id="marketToggle">
          <div>
            <div class="market-label" id="marketLabel">A carregar…</div>
            <div class="market-sub" id="marketSub"></div>
          </div>
          <button class="toggle-btn" id="toggleMarketBtn" disabled>—</button>
        </div>
        <div class="status-msg" id="marketStatus"></div>
      </section>

      <!-- ---------------- JOGOS ---------------- -->
      <section class="tab-panel" id="tab-matches">
        <div class="toolbar">
          <select id="newMatchHome"><option value="">Equipa da casa</option></select>
          <span style="color:var(--muted); font-size:12px;">vs</span>
          <select id="newMatchAway"><option value="">Equipa de fora</option></select>
          <input type="number" id="newMatchDay" placeholder="Jornada" style="width:90px;">
          <input type="datetime-local" id="newMatchDate">
          <button id="addMatchBtn">Adicionar jogo</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>Casa</th><th>Golos</th><th></th><th>Golos</th><th>Fora</th>
              <th>Estado</th><th>Jornada</th><th>Data</th>
              <th></th><th></th>
            </tr>
          </thead>
          <tbody id="matchesBody"></tbody>
        </table>
        <div class="status-msg" id="matchesStatus"></div>
      </section>
    </main>
  </div>

<script>
  const gate = document.getElementById('gate');
  const panel = document.getElementById('panel');
  let adminKey = sessionStorage.getItem('rcn_admin_key');

  function unlock(){
    gate.style.display = 'none';
    panel.style.display = 'block';
    loadClubs();
    loadPlayers();
  }

  function lock(message){
    sessionStorage.removeItem('rcn_admin_key');
    adminKey = null;
    gate.style.display = 'flex';
    panel.style.display = 'none';
    if(message) document.getElementById('gateError').textContent = message;
  }

  // se já houver uma chave guardada desta sessão, tenta entrar diretamente
  // (se entretanto tiver deixado de ser válida, o primeiro pedido à API falha e volta a pedir login)
  if(adminKey){
    unlock();
  }

  document.getElementById('gateBtn').addEventListener('click', async () => {
    const username = document.getElementById('adminUser').value.trim();
    const password = document.getElementById('adminPass').value;
    const errorEl = document.getElementById('gateError');
    errorEl.textContent = '';

    try{
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      if(!res.ok){
        const body = await res.json().catch(() => ({}));
        errorEl.textContent = body.error || 'Utilizador ou palavra-passe incorretos.';
        return;
      }
      const data = await res.json();
      adminKey = data.key;
      sessionStorage.setItem('rcn_admin_key', adminKey);
      unlock();
    }catch(err){
      errorEl.textContent = 'Não foi possível ligar ao servidor.';
    }
  });

  document.getElementById('adminLogout').addEventListener('click', () => {
    sessionStorage.removeItem('rcn_admin_key');
    window.location.reload();
  });

  // ---------- tabs ----------
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  // ---------- helper de pedidos à API admin ----------
  async function adminFetch(url, options = {}){
    const res = await fetch(url, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        'x-admin-key': adminKey,
        ...(options.headers || {})
      }
    });
    if(res.status === 401){
      lock('A sessão expirou. Inicia sessão outra vez.');
      throw new Error('Sessão expirada.');
    }
    if(!res.ok){
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error || ('Erro ' + res.status));
    }
    return res.status === 204 ? null : res.json();
  }

  /* ===================== CLUBES ===================== */
  let clubsCache = [];

  async function loadClubs(){
    const status = document.getElementById('clubsStatus');
    try{
      clubsCache = await adminFetch('/api/admin/clubs');
      renderClubs();
      fillClubSelect();
    }catch(err){ status.textContent = err.message; }
  }

  function renderClubs(){
    const body = document.getElementById('clubsBody');
    body.innerHTML = '';
    clubsCache.forEach(c => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input class="name-input" data-f="name" value="${c.name || ''}"></td>
        <td><input data-f="city" value="${c.city || ''}"></td>
        <td><input data-f="manager" value="${c.manager || ''}"></td>
        <td><input data-f="assistant_manager" value="${c.assistant_manager || ''}" placeholder="—"></td>
        <td><input class="role-input" data-f="discord_role_id" value="${c.discord_role_id || ''}" placeholder="ID do cargo"></td>
        <td><input data-f="budget" type="number" value="${c.budget ?? 30000}"></td>
        <td><input data-f="played" type="number" value="${c.played ?? 0}"></td>
        <td><input data-f="won" type="number" value="${c.won ?? 0}"></td>
        <td><input data-f="drawn" type="number" value="${c.drawn ?? 0}"></td>
        <td><input data-f="lost" type="number" value="${c.lost ?? 0}"></td>
        <td><input data-f="goals_for" type="number" value="${c.goals_for ?? 0}"></td>
        <td><input data-f="goals_against" type="number" value="${c.goals_against ?? 0}"></td>
        <td class="row-actions">
          <button class="save-btn">Guardar</button>
          <button class="del-btn">Apagar</button>
        </td>
      `;
      tr.querySelector('.save-btn').addEventListener('click', async () => {
        const updates = {};
        tr.querySelectorAll('[data-f]').forEach(inp => {
          const f = inp.dataset.f;
          updates[f] = inp.type === 'number' ? Number(inp.value) : inp.value;
        });
        const status = document.getElementById('clubsStatus');
        try{
          await adminFetch(`/api/admin/clubs/${c.id}`, { method:'PATCH', body: JSON.stringify(updates) });
          status.textContent = `"${updates.name}" atualizado.`;
          loadClubs();
        }catch(err){ status.textContent = err.message; }
      });
      tr.querySelector('.del-btn').addEventListener('click', async () => {
        if(!confirm(`Apagar o clube "${c.name}"?`)) return;
        try{
          await adminFetch(`/api/admin/clubs/${c.id}`, { method:'DELETE' });
          loadClubs();
        }catch(err){ document.getElementById('clubsStatus').textContent = err.message; }
      });
      body.appendChild(tr);
    });
  }

  document.getElementById('addClubBtn').addEventListener('click', async () => {
    const name = document.getElementById('newClubName').value.trim();
    const city = document.getElementById('newClubCity').value.trim();
    const manager = document.getElementById('newClubManager').value.trim();
    const assistant_manager = document.getElementById('newClubAssistant').value.trim();
    if(!name) return;
    try{
      await adminFetch('/api/admin/clubs', { method:'POST', body: JSON.stringify({ name, city, manager, assistant_manager }) });
      document.getElementById('newClubName').value = '';
      document.getElementById('newClubCity').value = '';
      document.getElementById('newClubManager').value = '';
      document.getElementById('newClubAssistant').value = '';
      loadClubs();
    }catch(err){ document.getElementById('clubsStatus').textContent = err.message; }
  });

  function fillClubSelect(){
    const sel = document.getElementById('newPlayerClub');
    sel.innerHTML = '<option value="">Sem clube</option>';
    clubsCache.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.id; opt.textContent = c.name;
      sel.appendChild(opt);
    });
  }

  /* ===================== JOGADORES ===================== */
  let playersCache = [];

  async function loadPlayers(){
    const status = document.getElementById('playersStatus');
    try{
      playersCache = await adminFetch('/api/admin/players');
      renderPlayers();
    }catch(err){ status.textContent = err.message; }
  }

  function clubOptions(selectedId){
    let html = `<option value="">Sem clube</option>`;
    clubsCache.forEach(c => {
      html += `<option value="${c.id}" ${c.id === selectedId ? 'selected' : ''}>${c.name}</option>`;
    });
    return html;
  }

  function renderPlayers(){
    const body = document.getElementById('playersBody');
    body.innerHTML = '';
    playersCache.forEach(p => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input class="name-input" data-f="name" value="${p.name || ''}"></td>
        <td><select data-f="club_id">${clubOptions(p.club_id)}</select></td>
        <td><input data-f="goals" type="number" value="${p.goals ?? 0}"></td>
        <td><input data-f="assists" type="number" value="${p.assists ?? 0}"></td>
        <td><input data-f="yellow_cards" type="number" value="${p.yellow_cards ?? 0}"></td>
        <td><input data-f="red_cards" type="number" value="${p.red_cards ?? 0}"></td>
        <td class="row-actions">
          <button class="save-btn">Guardar</button>
          <button class="del-btn">Apagar</button>
        </td>
      `;
      tr.querySelector('.save-btn').addEventListener('click', async () => {
        const updates = {};
        tr.querySelectorAll('[data-f]').forEach(inp => {
          const f = inp.dataset.f;
          if(f === 'club_id') updates[f] = inp.value || null;
          else updates[f] = inp.type === 'number' ? Number(inp.value) : inp.value;
        });
        const status = document.getElementById('playersStatus');
        try{
          await adminFetch(`/api/admin/players/${p.id}`, { method:'PATCH', body: JSON.stringify(updates) });
          status.textContent = `"${updates.name}" atualizado.`;
          loadPlayers();
        }catch(err){ status.textContent = err.message; }
      });
      tr.querySelector('.del-btn').addEventListener('click', async () => {
        if(!confirm(`Apagar o jogador "${p.name}"?`)) return;
        try{
          await adminFetch(`/api/admin/players/${p.id}`, { method:'DELETE' });
          loadPlayers();
        }catch(err){ document.getElementById('playersStatus').textContent = err.message; }
      });
      body.appendChild(tr);
    });
  }

  document.getElementById('addPlayerBtn').addEventListener('click', async () => {
    const name = document.getElementById('newPlayerName').value.trim();
    const club_id = document.getElementById('newPlayerClub').value || null;
    if(!name) return;
    try{
      await adminFetch('/api/admin/players', { method:'POST', body: JSON.stringify({ name, club_id }) });
      document.getElementById('newPlayerName').value = '';
      loadPlayers();
    }catch(err){ document.getElementById('playersStatus').textContent = err.message; }
  });

  /* ===================== MERCADO ===================== */
  async function loadMarket(){
    try{
      const data = await adminFetch('/api/admin/market');
      const label = document.getElementById('marketLabel');
      const sub = document.getElementById('marketSub');
      const btn = document.getElementById('toggleMarketBtn');

      if(data.is_open){
        label.textContent = '🟢 Mercado ABERTO';
        sub.textContent = data.opened_at ? 'Aberto em: ' + new Date(data.opened_at).toLocaleString('pt') : '';
        btn.textContent = 'Fechar Mercado';
        btn.className = 'toggle-btn close';
        btn.dataset.action = 'close';
      } else {
        label.textContent = '🔴 Mercado FECHADO';
        sub.textContent = data.closed_at ? 'Fechado em: ' + new Date(data.closed_at).toLocaleString('pt') : 'Nunca aberto';
        btn.textContent = 'Abrir Mercado';
        btn.className = 'toggle-btn open';
        btn.dataset.action = 'open';
      }
      btn.disabled = false;
    }catch(err){
      document.getElementById('marketStatus').textContent = err.message;
    }
  }

  document.getElementById('toggleMarketBtn').addEventListener('click', async () => {
    const btn = document.getElementById('toggleMarketBtn');
    const action = btn.dataset.action;
    const label = action === 'open' ? 'Abrir' : 'Fechar';
    if(!confirm(`Tens a certeza que queres ${label.toLowerCase()} o mercado de transferências?`)) return;
    btn.disabled = true;
    try{
      await adminFetch('/api/admin/market', { method:'POST', body: JSON.stringify({ action }) });
      document.getElementById('marketStatus').textContent = `Mercado ${action === 'open' ? 'aberto' : 'fechado'} com sucesso.`;
      loadMarket();
    }catch(err){
      document.getElementById('marketStatus').textContent = err.message;
      btn.disabled = false;
    }
  });

  // carrega mercado quando muda para essa tab
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const orig = btn.onclick;
    btn.addEventListener('click', () => {
      if(btn.dataset.tab === 'market') loadMarket();
      if(btn.dataset.tab === 'matches') loadMatches();
    });
  });

  /* ===================== JOGOS ===================== */
  let matchesCache = [];

  function matchClubOptions(selectedId){
    let html = `<option value="">—</option>`;
    clubsCache.forEach(c => {
      html += `<option value="${c.id}" ${c.id === selectedId ? 'selected' : ''}>${c.name}</option>`;
    });
    return html;
  }

  function fillMatchClubSelects(){
    document.getElementById('newMatchHome').innerHTML = '<option value="">Equipa da casa</option>' +
      clubsCache.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    document.getElementById('newMatchAway').innerHTML = '<option value="">Equipa de fora</option>' +
      clubsCache.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  }

  async function loadMatches(){
    const status = document.getElementById('matchesStatus');
    try{
      if(clubsCache.length === 0) await loadClubs();
      fillMatchClubSelects();
      matchesCache = await adminFetch('/api/admin/matches');
      renderMatches();
    }catch(err){ status.textContent = err.message; }
  }

  function clubName(id){
    const c = clubsCache.find(c => c.id === id);
    return c ? c.name : '—';
  }

  function renderMatches(){
    const body = document.getElementById('matchesBody');
    body.innerHTML = '';
    matchesCache.forEach(m => {
      const tr = document.createElement('tr');
      const dateVal = m.played_at ? new Date(m.played_at).toISOString().slice(0, 16) : '';
      tr.innerHTML = `
        <td><select data-f="home_club_id">${matchClubOptions(m.home_club_id)}</select></td>
        <td><input data-f="home_score" type="number" value="${m.home_score ?? ''}" style="width:48px;"></td>
        <td style="color:var(--muted);">–</td>
        <td><input data-f="away_score" type="number" value="${m.away_score ?? ''}" style="width:48px;"></td>
        <td><select data-f="away_club_id">${matchClubOptions(m.away_club_id)}</select></td>
        <td>
          <select data-f="status">
            <option value="scheduled" ${m.status === 'scheduled' ? 'selected' : ''}>Agendado</option>
            <option value="played" ${m.status === 'played' ? 'selected' : ''}>Realizado</option>
          </select>
        </td>
        <td><input data-f="matchday" type="number" value="${m.matchday ?? ''}" style="width:60px;"></td>
        <td><input data-f="played_at" type="datetime-local" value="${dateVal}" style="width:170px;"></td>
        <td class="row-actions">
          <button class="save-btn">Guardar</button>
          <button class="del-btn">Apagar</button>
        </td>
        <td><button class="events-btn">Eventos</button></td>
      `;
      tr.querySelector('.save-btn').addEventListener('click', async () => {
        const updates = {};
        tr.querySelectorAll('[data-f]').forEach(inp => {
          const f = inp.dataset.f;
          if(f === 'home_score' || f === 'away_score'){
            updates[f] = inp.value === '' ? null : Number(inp.value);
          } else if(f === 'matchday'){
            updates[f] = inp.value === '' ? null : Number(inp.value);
          } else if(f === 'played_at'){
            updates[f] = inp.value ? new Date(inp.value).toISOString() : null;
          } else {
            updates[f] = inp.value;
          }
        });
        const status = document.getElementById('matchesStatus');
        try{
          await adminFetch(`/api/admin/matches/${m.id}`, { method:'PATCH', body: JSON.stringify(updates) });
          status.textContent = 'Jogo atualizado. Classificação recalculada.';
          loadMatches();
          loadClubs();
        }catch(err){ status.textContent = err.message; }
      });
      tr.querySelector('.del-btn').addEventListener('click', async () => {
        if(!confirm(`Apagar o jogo ${clubName(m.home_club_id)} vs ${clubName(m.away_club_id)}?`)) return;
        try{
          await adminFetch(`/api/admin/matches/${m.id}`, { method:'DELETE' });
          loadMatches();
          loadClubs();
        }catch(err){ document.getElementById('matchesStatus').textContent = err.message; }
      });
      body.appendChild(tr);

      const eventsRow = document.createElement('tr');
      eventsRow.style.display = 'none';
      eventsRow.innerHTML = `<td colspan="10" style="background:rgba(255,255,255,.03);"><div class="events-panel"></div></td>`;
      body.appendChild(eventsRow);
      const eventsPanel = eventsRow.querySelector('.events-panel');

      tr.querySelector('.events-btn').addEventListener('click', async () => {
        const showing = eventsRow.style.display !== 'none';
        eventsRow.style.display = showing ? 'none' : 'table-row';
        if(!showing) await renderMatchEvents(m, eventsPanel);
      });
    });
  }

  function playerOptionsForClub(clubId){
    const players = playersCache.filter(p => p.club_id === clubId);
    return players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
  }

  const eventTypeLabels = { goal: 'Golo', own_goal: 'Autogolo', assist: 'Assistência', yellow: 'Cartão amarelo', red: 'Cartão vermelho' };

  async function renderMatchEvents(m, panel){
    panel.innerHTML = '<p style="color:var(--muted); font-size:12px;">A carregar…</p>';
    if(playersCache.length === 0) await loadPlayers();
    let events;
    try{
      events = await adminFetch(`/api/admin/matches/${m.id}/events`);
    }catch(err){
      panel.innerHTML = `<p style="color:var(--red); font-size:12px;">${err.message}</p>`;
      return;
    }

    const list = events.map(ev => `
      <div style="display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--line); font-size:12.5px;">
        <span style="min-width:36px; color:var(--muted);">${ev.minute != null ? ev.minute + "'" : '—'}</span>
        <span style="min-width:130px;">${eventTypeLabels[ev.event_type] || ev.event_type}</span>
        <span style="flex:1;">${ev.player_name || '—'} <span style="color:var(--muted);">(${clubName(ev.club_id)})</span></span>
        <button class="del-event-btn" data-id="${ev.id}" style="background:none;border:none;color:var(--muted);cursor:pointer;">Apagar</button>
      </div>
    `).join('') || '<p style="color:var(--muted); font-size:12px;">Sem acontecimentos registados.</p>';

    panel.innerHTML = `
      ${list}
      <div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; align-items:center;">
        <select class="ev-club">
          <option value="${m.home_club_id}">${clubName(m.home_club_id)}</option>
          <option value="${m.away_club_id}">${clubName(m.away_club_id)}</option>
        </select>
        <select class="ev-player"><option value="">Jogador (opcional)</option></select>
        <input class="ev-player-name" type="text" placeholder="Nome (se não estiver na lista)" style="width:170px;">
        <select class="ev-type">
          <option value="goal">Golo</option>
          <option value="own_goal">Autogolo</option>
          <option value="assist">Assistência</option>
          <option value="yellow">Cartão amarelo</option>
          <option value="red">Cartão vermelho</option>
        </select>
        <input class="ev-minute" type="number" placeholder="Min." style="width:60px;">
        <button class="add-event-btn">Adicionar</button>
      </div>
    `;

    const clubSelect = panel.querySelector('.ev-club');
    const playerSelect = panel.querySelector('.ev-player');
    const fillPlayers = () => { playerSelect.innerHTML = '<option value="">Jogador (opcional)</option>' + playerOptionsForClub(clubSelect.value); };
    fillPlayers();
    clubSelect.addEventListener('change', fillPlayers);

    panel.querySelectorAll('.del-event-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        try{
          await adminFetch(`/api/admin/match-events/${btn.dataset.id}`, { method:'DELETE' });
          renderMatchEvents(m, panel);
        }catch(err){ alert(err.message); }
      });
    });

    panel.querySelector('.add-event-btn').addEventListener('click', async () => {
      const playerId = playerSelect.value;
      const playerObj = playersCache.find(p => p.id === playerId);
      const manualName = panel.querySelector('.ev-player-name').value.trim();
      try{
        await adminFetch(`/api/admin/matches/${m.id}/events`, {
          method: 'POST',
          body: JSON.stringify({
            club_id: clubSelect.value,
            player_id: playerId || null,
            player_name: manualName || (playerObj ? playerObj.name : null),
            event_type: panel.querySelector('.ev-type').value,
            minute: panel.querySelector('.ev-minute').value
          })
        });
        renderMatchEvents(m, panel);
      }catch(err){ alert(err.message); }
    });
  }

  document.getElementById('addMatchBtn').addEventListener('click', async () => {
    const home_club_id = document.getElementById('newMatchHome').value;
    const away_club_id = document.getElementById('newMatchAway').value;
    const matchday = document.getElementById('newMatchDay').value;
    const dateInput = document.getElementById('newMatchDate').value;
    const status = document.getElementById('matchesStatus');
    if(!home_club_id || !away_club_id){ status.textContent = 'Escolhe as duas equipas.'; return; }
    try{
      await adminFetch('/api/admin/matches', {
        method:'POST',
        body: JSON.stringify({
          home_club_id,
          away_club_id,
          matchday: matchday ? Number(matchday) : null,
          played_at: dateInput ? new Date(dateInput).toISOString() : new Date().toISOString()
        })
      });
      document.getElementById('newMatchDay').value = '';
      document.getElementById('newMatchDate').value = '';
      status.textContent = 'Jogo adicionado.';
      loadMatches();
    }catch(err){ status.textContent = err.message; }
  });

</script>

</body>
</html>
